name: Release

on:
  release:
    types: [published]

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PlatformIO
        run: |
          # Pinned: PlatformIO 6.2.0 resolves tool-scons to ~4.41101.0, but SCons
          # 4.9 removed SCons.Tool.FortranCommon, which the pioarduino
          # platform-espressif32 builder still imports -> every ESP32 env fails with
          # "ModuleNotFoundError: No module named 'SCons.Tool.FortranCommon'".
          # (Native envs are unaffected, which is why only the firmware steps broke.)
          # 6.1.19 pulls tool-scons 4.40801.0 and matches the pinned platform.
          # Revisit when pioarduino supports SCons >= 4.9.
          pip install 'platformio==6.1.19'
          pio --version

      - name: Build controller firmware
        run: pio run -e esp32-furnace-controller

      - name: Build thermostat firmware
        run: pio run -e esp32-furnace-thermostat

      - name: Rename firmware binaries
        run: |
          cp .pio/build/esp32-furnace-controller/firmware.bin esp32-furnace-controller.bin
          cp .pio/build/esp32-furnace-thermostat/firmware.bin esp32-furnace-thermostat.bin

      - name: Upload firmware to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            esp32-furnace-controller.bin
            esp32-furnace-thermostat.bin
